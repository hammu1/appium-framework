# ============================================================
# Appium Framework Configuration
# ============================================================
# Override any value at runtime: -Dapp.path=apps/myapp.apk

# --- Appium server ---
appium.server.url=http://127.0.0.1:4723
appium.server.autoStart=true
appium.server.host=127.0.0.1
appium.server.port=4723

# --- Device ---
platform.name=Android
device.name=emulator-5554
platform.version=
automation.name=UiAutomator2

# --- App ---
# Drop your APK in apps/ and set the filename here, OR pass -Dapp.path=...
# Leave blank to auto-pick the first .apk found in apps/
app.path=
# Set to true to force install even if same package already on device
app.fullReset=false
app.noReset=true

# --- Timeouts (seconds) ---
implicit.wait=0
explicit.wait=20
new.command.timeout=300

# --- Smoke crawler ---
crawler.enabled=true
crawler.duration.seconds=60
crawler.max.depth=10
crawler.screenshot.each.step=true

# --- Reporting ---
screenshot.on.failure=true
screenshot.dir=target/screenshots
